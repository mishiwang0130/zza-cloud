spring:
  application:
    name: infra
  profiles:
    # 默认走 dev：本地与内网开发环境用同一份连接配置，生产必须显式指定 prod
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      # 与 InfraFileServiceImpl 里的上限保持一致：容器先拦截，服务里再兜一层
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: 8082

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    # 库表 snake_case 与 Java camelCase 自动映射
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

zza:
  jwt:
    # access token 有效期（秒）：网关与本服务共用同一个值，改动时两边要一起改
    expire-seconds: 7200
  infra:
    token:
      # 续期凭证有效期（秒），默认 7 天
      refresh-expire-seconds: 604800
      # 用户权限集合缓存有效期（秒），默认 30 分钟；授权变更时会主动清理
      permission-cache-seconds: 1800
    security:
      # 访问令牌的请求参数名：WebSocket / SSE 这类无法设置请求头的场景用它传令牌，留空表示不读参数
      token-parameter: token
      # 模拟登录开关：仅本地联调用（令牌形如 <mock-secret><用户 ID>），生产必须保持 false
      mock-enable: false
      # 模拟登录密钥：只有以它开头的令牌才会被识别为模拟令牌
      mock-secret: test

knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  default-flat-param-object: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
