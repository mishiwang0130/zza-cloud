# 生产环境：连接信息与密钥一律从环境变量读取，禁止在此文件里出现明文口令
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: 'jdbc:mysql://${INFRA_DB_HOST:127.0.0.1}:${INFRA_DB_PORT:3306}/${INFRA_DB_NAME:zza}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8'
    username: ${INFRA_DB_USERNAME:root}
    password: ${INFRA_DB_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      validation-query: SELECT 1
  data:
    redis:
      host: ${INFRA_REDIS_HOST:127.0.0.1}
      port: ${INFRA_REDIS_PORT:6379}
      database: ${INFRA_REDIS_DATABASE:0}
      password: ${INFRA_REDIS_PASSWORD}
      timeout: 5s
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR}

zza:
  jwt:
    secret: ${JWT_SECRET}
  minio:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:zza}
