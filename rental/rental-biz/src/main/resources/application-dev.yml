spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # MySQL 在本机（本机 MySQL80 服务），与 infra 指向同一个 zza 库；Redis、Nacos、RocketMQ 才在内网的 192.168.205.128
    url: 'jdbc:mysql://localhost:3306/zza?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8'
    username: root
    password: root
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      validation-query: SELECT 1
  data:
    redis:
      host: 192.168.205.128
      port: 6379
      database: 0
      password: 123456
      timeout: 5s
  cloud:
    nacos:
      server-addr: 192.168.205.128:8848

# SQL 日志：Mapper 包调到 debug，MyBatis 会把 SQL 与参数按 logging.pattern 打进正常日志（带 traceId），
# 方便按 traceId 串起「接口 → SQL」；只开 dev，prod 不开，避免敏感参数落盘
logging:
  level:
    com.wxy.rental.biz.mapper: debug

rocketmq:
  # 浏览记录异步落库用的 NameServer；生产者与消费者等 infra 的 App 用户与登录就绪后再写
  name-server: 192.168.205.128:9876
