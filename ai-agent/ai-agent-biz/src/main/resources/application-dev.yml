# ============================================================================
# 开发环境（内网）：本机 MySQL + 虚拟机上的 Redis / MinIO / Nacos / Qdrant / RocketMQ + 百炼工作空间模型
#
# 换环境要改的值都在这里；不想依赖某件中间件时按下面注释切开关：
#   - 知识库原文件不想用 MinIO：zza.ai-agent.knowledge.storage-type 改成 local
#   - 不想连 Qdrant：spring.ai.vectorstore.qdrant.initialize-schema=false 且 zza.ai-agent.rag.enabled=false
#   - 没起 RocketMQ：zza.ai-agent.knowledge.parse-mode 改成 sync（退回接口内同步解析）
# ============================================================================

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 会话与知识库文档记录都在本机 MySQL 的 zza 库（与 infra / rental 同库）
    url: 'jdbc:mysql://localhost:3306/zza?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8'
    username: root
    password: root
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      validation-query: SELECT 1
  data:
    redis:
      host: 192.168.205.128
      port: 6379
      database: 0
      password: 123456
      timeout: 5s
  cloud:
    nacos:
      server-addr: 192.168.205.128:8848
  ai:
    # 千问走 OpenAI 兼容模式：该百炼工作空间只提供 /compatible-mode 网关，DashScope 原生路径会直接 400
    openai:
      # Key 只从环境变量读：PowerShell 里 $env:DASHSCOPE_API_KEY = 'sk-xxx'
      api-key: ${DASHSCOPE_API_KEY:}
      # Spring AI 会在这个地址后面拼 /v1/chat/completions 与 /v1/embeddings，所以必须带 /compatible-mode
      base-url: '${DASHSCOPE_BASE_URL:https://ws-jtlrm6raueuwkv9p.cn-beijing.maas.aliyuncs.com/compatible-mode}'
      chat:
        options:
          model: ${DASHSCOPE_CHAT_MODEL:qwen3.7-max}
          # 随机性 0~1：越小回答越稳定，客服问答建议 0.2~0.5
          temperature: 0.5
      embedding:
        options:
          model: ${DASHSCOPE_EMBEDDING_MODEL:qwen3.7-text-embedding-flash}
    memory:
      redis:
        # 复用业务 Redis 的连接信息，避免两处配置漂移
        host: ${spring.data.redis.host}
        port: ${spring.data.redis.port}
        password: ${spring.data.redis.password}
        database: ${spring.data.redis.database}
    vectorstore:
      qdrant:
        # 6334 是 gRPC 端口（Spring AI 用这个），6333 是 REST 端口
        host: ${QDRANT_HOST:192.168.205.128}
        port: ${QDRANT_PORT:6334}
        api-key: ${QDRANT_API_KEY:}
        # 启动时自动建集合（已存在则跳过）
        initialize-schema: true

rocketmq:
  # 知识库解析任务的生产者与消费者都用这个 NameServer；Broker 地址由 NameServer 下发
  name-server: 192.168.205.128:9876

zza:
  ai-agent:
    knowledge:
      # 原文件落对象存储；没有 MinIO 时改成 local 即可零中间件调试
      storage-type: minio
  minio:
    endpoint: http://192.168.205.128:9000
    access-key: minio
    secret-key: minio123
    bucket: zza

logging:
  level:
    # 排查检索、会话、工具调用细节时看 debug 日志
    com.wxy.ai.agent: debug
    # SQL 日志：Mapper 包已在上面服务级 debug 覆盖，这里显式列出，便于按包检索
    com.wxy.ai.agent.biz.mapper: debug
