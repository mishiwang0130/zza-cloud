# ============================================================================
# 生产环境：所有外部依赖与密钥都由环境变量注入，缺失时启动直接失败
# ============================================================================

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: 'jdbc:mysql://${AI_AGENT_DB_HOST:127.0.0.1}:${AI_AGENT_DB_PORT:3306}/${AI_AGENT_DB_NAME:zza}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8'
    username: ${AI_AGENT_DB_USERNAME:root}
    password: ${AI_AGENT_DB_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      validation-query: SELECT 1
  data:
    redis:
      host: ${AI_AGENT_REDIS_HOST:127.0.0.1}
      port: ${AI_AGENT_REDIS_PORT:6379}
      database: ${AI_AGENT_REDIS_DATABASE:0}
      password: ${AI_AGENT_REDIS_PASSWORD}
      timeout: 5s
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR}
  ai:
    # 生产同 dev：走百炼工作空间的 OpenAI 兼容网关（DashScope 原生路径会 400）
    openai:
      api-key: ${DASHSCOPE_API_KEY}
      # 必须指向 /compatible-mode，Spring AI 会在后面拼 /v1/chat/completions 与 /v1/embeddings
      base-url: ${DASHSCOPE_BASE_URL}
      chat:
        options:
          model: ${DASHSCOPE_CHAT_MODEL}
          temperature: 0.5
      embedding:
        options:
          model: ${DASHSCOPE_EMBEDDING_MODEL}
    memory:
      redis:
        host: ${spring.data.redis.host}
        port: ${spring.data.redis.port}
        password: ${spring.data.redis.password}
        database: ${spring.data.redis.database}
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST}
        port: ${QDRANT_PORT:6334}
        api-key: ${QDRANT_API_KEY:}
        # 生产不自建集合：由运维提前建好，避免应用启动时改动向量库结构
        initialize-schema: false

zza:
  ai-agent:
    knowledge:
      storage-type: minio
  minio:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:zza}

knife4j:
  # 生产关掉接口文档入口
  enable: false
